<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003E9D" />
    <meta name="description" content="Márcio Bins Ely — O Rio Grande pode mais. E nós vamos provar isso juntos. Mais de 20 anos de trabalho por Porto Alegre: 833 projetos, 6 frentes parlamentares e política feita com a comunidade." />
    <title>Márcio Bins Ely · O Rio Grande pode mais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Roboto+Slab:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Fontes da landing executiva (/lp) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Aplica o tema salvo antes da pintura (evita flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mbd_theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
