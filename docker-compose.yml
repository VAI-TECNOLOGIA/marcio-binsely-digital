services:
  db:
    image: postgres:16-alpine
    container_name: mbd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbd
      POSTGRES_PASSWORD: mbd_secret
      POSTGRES_DB: marcio_binsely
    ports:
      - "5432:5432"
    volumes:
      - mbd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbd -d marcio_binsely"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mbd_pgdata:
